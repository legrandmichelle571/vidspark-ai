<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSpark AI - Login</title>
  <style>
    :root {
      --bg:       #07070a;
      --b1:       #1e1e26;
      --b2:       #2a2a35;
      --text:     #e8e8f0;
      --muted:    #8888a0;
      --purple:   #7c6dfa;
      --purple-l: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 400px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--purple-l);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(124,109,250,.2);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading {
      display: none;
    }

    .loading.show {
      display: block;
    }

    .login {
      display: block;
    }

    .login.hide {
      display: none;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading State -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <h1>Authenticating...</h1>
      <p>Connecting to your VidSpark AI account</p>
      <div class="status">Please wait</div>
    </div>

    <!-- Login State -->
    <div id="login" class="login">
      <div class="logo">✨</div>
      <h1>VidSpark AI</h1>
      <p>YouTube SEO Intelligence</p>
      <button class="btn" id="loginBtn">Sign In with Google</button>
      <div class="status">Secure login on vidsparkpro.com</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
