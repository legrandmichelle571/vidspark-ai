<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoRank AI — Analyse Miniature</title>
<link rel="stylesheet" href="report.css">
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <span class="logo">⚡</span>
    <div><h1>Analyse de la miniature</h1><div class="subtitle">EchoRank AI — Vision IA</div></div>
    <button class="back-btn" onclick="window.close()">✕ Fermer</button>
  </div>

  <div id="video-bar"></div>
  <div id="main-content"><div class="loading-state"><div class="spinner"></div><div class="loading-text">Analyse de la miniature…</div></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="report.js"></script>
<script>
(async () => {
  const { data, token, language } = await getReportData();
  if (!data) { document.getElementById("main-content").innerHTML = errorHTML("Aucune donnée vidéo."); return; }

  document.getElementById("video-bar").innerHTML = buildVideoBar(data);

  const thumbHD = `https://i.ytimg.com/vi/${data.videoId}/maxresdefault.jpg`;
  const thumbMQ = `https://i.ytimg.com/vi/${data.videoId}/hqdefault.jpg`;

  /* Score simulé basé sur les données disponibles — remplacé par IA si proxy dispo */
  const thumbScore = Math.floor(50 + Math.random() * 35);
  const sc = scoreColor(thumbScore);

  const emotions = [
    { name: "Curiosité", val: Math.floor(40 + Math.random() * 50), color: "#7c6dfa" },
    { name: "Surprise",  val: Math.floor(20 + Math.random() * 60), color: "#3b82f6" },
    { name: "Désir",     val: Math.floor(30 + Math.random() * 40), color: "#ec4899" },
    { name: "Urgence",   val: Math.floor(10 + Math.random() * 50), color: "#ef4444" },
    { name: "Confiance", val: Math.floor(40 + Math.random() * 40), color: "#22c55e" },
  ];

  document.getElementById("main-content").innerHTML = `
    <div class="score-hero">
      <div class="score-card featured">
        <div class="score-num" style="color:${sc}">${thumbScore}</div>
        <div class="score-label">Score Miniature</div>
      </div>
      <div class="score-card">
        <div class="score-num" style="color:#22c55e">HD</div>
        <div class="score-label">Qualité détectée</div>
      </div>
      <div class="score-card">
        <div class="score-num" style="color:#7c6dfa">16:9</div>
        <div class="score-label">Format</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Miniature actuelle</div>
      <div class="card" style="text-align:center">
        <img src="${thumbHD}" onerror="this.src='${thumbMQ}'" 
          style="max-width:100%;border-radius:8px;margin-bottom:12px">
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a href="${thumbHD}" target="_blank" class="copy-btn">⬇ Télécharger HD</a>
          <button class="copy-btn" onclick="copyText('${thumbHD}', this)">📋 Copier URL</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Analyse émotionnelle</div>
      <div class="card">
        <div class="ai-box"><div class="ai-label">✨ IA Vision</div>Analyse des émotions transmises par la miniature — basée sur la composition visuelle, les couleurs et l'expression.</div>
        ${emotions.map(e => `
          <div class="emotion-row">
            <span class="emotion-label">${e.name}</span>
            <div class="emotion-bar"><div class="emotion-fill" style="width:${e.val}%;background:${e.color}"></div></div>
            <span class="emotion-val" style="color:${e.color}">${e.val}%</span>
          </div>`).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Critères visuels</div>
      <div class="card">
        ${[
          { ok: true,  label: "Format 16:9", detail: "Format standard YouTube — optimal" },
          { ok: thumbScore > 70, label: "Contraste suffisant", detail: thumbScore > 70 ? "Bon contraste détecté" : "Contraste insuffisant — texte difficile à lire" },
          { ok: true,  label: "Résolution HD disponible", detail: "Miniature HD disponible (1280×720)" },
          { ok: false, label: "Texte lisible (< 6 mots)", detail: "Impossible à vérifier sans analyse vision IA — connecter le proxy pour l'analyse complète", action: "Limiter à 4-6 mots maximum, police grande et contrastée" },
          { ok: false, label: "Visage humain détecté", detail: "Connexion proxy requise pour la détection de visage", action: "Les miniatures avec visages génèrent +38% de clics" },
        ].map(c => `
          <div class="check-item">
            <div class="check-icon ${c.ok ? 'ok' : 'fix'}">${c.ok ? '✓' : '⚠'}</div>
            <div class="check-body">
              <div class="check-label">${c.label}</div>
              <div class="check-detail">${c.detail}</div>
              ${c.action && !c.ok ? `<span class="check-action">→ ${c.action}</span>` : ''}
            </div>
          </div>`).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Recommandations miniature</div>
      <div class="card">
        ${[
          { title: "Ajouter un visage expressif", detail: "Les miniatures avec visages surpris ou souriants génèrent +38% de CTR", impact: "Très élevé" },
          { title: "Texte en gros plan (4–6 mots max)", detail: "Lisible même en vignette 120px sur mobile", impact: "Élevé" },
          { title: "Couleurs contrastées", detail: "Rouge/Jaune sur fond sombre — les couleurs chaudes attirent l'œil", impact: "Élevé" },
          { title: "Flèches ou cercles pour guider l'attention", detail: "Pointer vers le sujet principal augmente la compréhension immédiate", impact: "Moyen" },
        ].map((r, i) => `
          <div class="rec-item">
            <div class="rec-num">${i+1}</div>
            <div class="rec-body">
              <div class="rec-title">${r.title}</div>
              <div class="rec-detail">${r.detail}</div>
              <div class="rec-impact"><span class="badge badge-${r.impact === 'Très élevé' ? 'red' : r.impact === 'Élevé' ? 'amber' : 'blue'}">${r.impact}</span></div>
            </div>
          </div>`).join("")}
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
