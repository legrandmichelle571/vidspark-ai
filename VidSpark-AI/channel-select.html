<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSpark AI — Select Channel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f1117 0%, #161b22 100%);
      color: #c9d1d9;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 16px;
      color: #8b949e;
      line-height: 1.6;
    }

    .channels-section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      padding: 16px;
      background: rgba(30, 30, 40, 0.4);
      border: 2px solid #30363d;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .channel-item:hover {
      border-color: #58a6ff;
      background: rgba(30, 30, 40, 0.6);
    }

    .channel-item.selected {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
    }

    .channel-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #6e7681;
      margin-right: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .channel-item.selected .channel-radio {
      border-color: #00d4ff;
      background: #00d4ff;
    }

    .channel-radio::after {
      content: '✓';
      color: #000;
      font-weight: bold;
      font-size: 12px;
      opacity: 0;
    }

    .channel-item.selected .channel-radio::after {
      opacity: 1;
    }

    .channel-info {
      flex: 1;
    }

    .channel-name {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .channel-subscribers {
      font-size: 13px;
      color: #8b949e;
    }

    .channel-badge {
      display: inline-block;
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: linear-gradient(90deg, #00d4ff, #0099cc);
      color: #000;
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(0, 212, 255, 0.1);
      color: #00d4ff;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: rgba(0, 212, 255, 0.5);
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 212, 255, 0.2);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      color: #f85149;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .info-box {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .info-box strong {
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">✨</div>
      <h1 id="greeting">Welcome!</h1>
      <p class="subtitle">Select your primary YouTube channel</p>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="info-box">
      <strong>Note:</strong> You can add more channels later. For now, select your primary channel.
    </div>

    <div class="channels-section">
      <div class="section-title">Your Channels</div>
      <div id="channelsList" class="channel-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading your channels...</p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="backBtn">Back</button>
      <button class="btn btn-primary" id="continueBtn" disabled>Continue</button>
    </div>
  </div>

  <script src="channel-select.js"></script>
</body>
</html>
