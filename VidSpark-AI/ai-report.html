function RT(k){ return RL[k] || RI.en[k] || k; }

/* ══ UTILITAIRES ══ */
function esc(s){if(!s)return"";return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function sc(n){return n>=80?"#22c55e":n>=60?"#eab308":"#ef4444";}
function sb(n){return n>=80?"badge-green":n>=60?"badge-amber":"badge-red";}
function pRow(lbl,val,max,col){
  const pct=Math.min(100,Math.round(val/max*100));
  return`<div class="progress-row"><span class="progress-label">${lbl}</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${col||"#7c6dfa"}"></div></div><span class="progress-val" style="color:${col||"#7c6dfa"}">${val}</span></div>`;
}
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

/* ══ CHARGER LES DONNÉES ══ */
function loadData(){
  return new Promise(r=>{
    chrome.storage.local.get(["echoReportData","userToken","echoLanguage"],d=>{
      const lang = d.echoLanguage||"fr";
      RL = RI[lang]||RI.en;
      if(lang==="ar"){
        document.documentElement.setAttribute("dir","rtl");
        document.body.style.textAlign="right";
      }
      /* Mettre à jour les boutons header maintenant que RL est défini */
      document.getElementById("btn-print").textContent = RT("print");
      document.getElementById("btn-close").textContent = RT("close");
      document.getElementById("loading-msg").textContent = RT("loading");
      r({data:d.echoReportData||null, token:d.userToken||"free_demo_token", lang});
    });
  });
}

/* ══ PROXY ══ */
const PROXY="https://vidspark-proxy.VOTRE_SUBDOMAIN.workers.dev";
async function callProxy(action,data,lang,token){
  try{
    const r=await fetch(PROXY+"/api",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},
      body:JSON.stringify({action,videoId:data.videoId,title:data.title,description:data.description,language:lang})
    });
    if(!r.ok)return null;
    return r.json();
  }catch{return null;}
}

  function svgRadar(scores, labels, colors){
    const cx=120,cy=120,r=85,n=scores.length;
    const angles=scores.map((_,i)=>((i/n)*2*Math.PI)-Math.PI/2);
    function pt(val,i){const a=angles[i],rv=r*(val/100);return[cx+rv*Math.cos(a),cy+rv*Math.sin(a)];}
    const grid=[20,40,60,80,100].map(g=>{
      const pts=angles.map((_,i)=>pt(g,i)).map(p=>p.join(",")).join(" ");
      return`<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    }).join("");
    const axes=angles.map((a,i)=>`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`).join("");
    const lbls=angles.map((a,i)=>{
      const lx=cx+(r+16)*Math.cos(a), ly=cy+(r+16)*Math.sin(a);
      return`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#888">${labels[i]}</text>`;
    }).join("");
    function polygon(vals,fill,stroke){
      const pts=vals.map((v,i)=>pt(v,i).join(",")).join(" ");
      return`<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    }
    return`<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:200px">${grid}${axes}${lbls}${polygon(scores[1],"rgba(34,197,94,.08)","#22c55e")}${polygon(scores[0],"rgba(124,109,250,.18)","#7c6dfa")}<text x="10" y="228" font-size="10" fill="#666">${RT("current")}</text><rect x="6" y="220" width="8" height="8" fill="rgba(124,109,250,.5)"/><text x="60" y="228" font-size="10" fill="#666">${RT("potential")}</text><rect x="56" y="220" width="8" height="8" fill="rgba(34,197,94,.5)"/></svg>`;
  }

  function svgBars(labels,current,potential){
    const bw=40,gap=20,h=160,pw=labels.length*(bw*2+gap)+gap,ph=180;
    let bars="",xtxt="";
    labels.forEach((l,i)=>{
      const x=gap+i*(bw*2+gap);
      const hc=Math.round((current[i]/100)*h), hp=Math.round((potential[i]/100)*h);
      bars+=`<rect x="${x}" y="${ph-hc-10}" width="${bw}" height="${hc}" fill="rgba(124,109,250,.6)" rx="3"/>`;
      bars+=`<rect x="${x+bw+2}" y="${ph-hp-10}" width="${bw}" height="${hp}" fill="rgba(34,197,94,.6)" rx="3"/>`;
      bars+=`<text x="${x+bw}" y="${ph+6}" text-anchor="middle" font-size="10" fill="#888">${l}</text>`;
      bars+=`<text x="${x+bw/2}" y="${ph-hc-14}" text-anchor="middle" font-size="9" fill="#a78bfa">${current[i]}</text>`;
      bars+=`<text x="${x+bw+2+bw/2}" y="${ph-hp-14}" text-anchor="middle" font-size="9" fill="#22c55e">${potential[i]}</text>`;
    });
    // grid lines
    [25,50,75,100].forEach(v=>{
      const y=ph-Math.round((v/100)*h)-10;
      bars+=`<line x1="0" y1="${y}" x2="${pw}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    });
    return`<svg viewBox="0 0 ${pw} ${ph+20}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:200px">${bars}</svg>`;
  }

  const radarCurr=[seo,viral,thumb,Math.round(ctr*10),Math.min(100,Math.round(dLen/1000*100)),Math.min(100,(data.title||"").split(/\s+/).filter(w=>w.length>3).length*15)];

    if(res.viral_reason){
      document.getElementById("exec-ai-text").innerHTML=
        `<strong>${RT("ai_seo_label")} :</strong> ${esc(res.viral_reason)}`;
    }
    const items=(res.checklist||[]).map(c=>`
      <div class="check-item">
        <div class="check-icon ${c.status==="ok"?"ok":"fix"}">${c.status==="ok"?"✓":"⚠"}</div>
        <div class="check-body">
          <div class="check-label">${esc(c.item)}</div>
          <div class="check-detail">${esc(c.detail)}</div>
        </div>
      </div>`).join("");
    document.getElementById("seo-ai").innerHTML=`
      <div class="ai-box"><div class="ai-label">${RT("ai_seo_label")}</div>${esc(res.viral_reason||"")}</div>
      <div style="display:flex;align-items:center;gap:10px;margin:8px 0">
        <span style="font-size:28px;font-weight:800;color:${rc}">${rs}/100</span>
        <span class="badge ${sb(rs)}">${RT("ai_score_label")}</span>
        ${res.viral_score?`<span style="font-size:12px;color:#888">· ${RT("viral")} ${res.viral_score}/100</span>`:""}
      </div>${items}`;
    document.getElementById("viral-ai").innerHTML=`
      <div class="ai-box"><div class="ai-label">${RT("ai_viral_label")}</div>${esc(res.viral_reason||"")}</div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
        <span style="font-size:24px;font-weight:800;color:${sc(res.viral_score||viral)}">${res.viral_score||viral}/100</span>
        <span style="font-size:12px;color:#888">${RT("ai_viral_score")}</span>
      </div>`;
    const suggs=(res.suggestions||[]).map((s,i)=>`
      <div class="rec-item"><div class="rec-num">${i+1}</div>
      <div class="rec-body"><div class="rec-title">${esc(s)}</div></div></div>`).join("");
    document.getElementById("comp-ai").innerHTML=`
      <div class="ai-box"><div class="ai-label">${RT("ai_comp_label")}</div>${esc(res.viral_reason||"")}</div>
      ${suggs?`<div style="margin-top:8px">${suggs}</div>`:""}`;
  } else {
    ["seo-ai","viral-ai","comp-ai"].forEach(id=>{
      document.getElementById(id).innerHTML=`<div style="color:#888;font-size:13px;padding:8px">${RT("ai_unavail")}</div>`;
    });
  }

  /* TITRES IA */
  if(titRes.status==="fulfilled"&&titRes.value){
    const titles=titRes.value.titles||[];
    const types=[RT("seo"),RT("ctr_est"),"Viral","Shorts","Trending"];
    document.getElementById("titles-ai").innerHTML=titles.length>0
      ?titles.map((t,i)=>`
        <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #1a1a1a">
          <span style="width:22px;height:22px;background:#1a1a2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#7c6dfa;flex-shrink:0;margin-top:2px">${i+1}</span>
          <div style="flex:1">
            <div style="font-size:11px;color:#7c6dfa;font-weight:600;margin-bottom:3px">${types[i]||""}</div>
            <div style="font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.4">${esc(t.text)}</div>
            <div style="display:flex;gap:5px">
              <span class="badge ${sb(t.score||75)}">${t.score||"—"}/100</span>
              ${t.hook?`<span class="badge badge-purple">${esc(t.hook)}</span>`:""}
            </div>
          </div>
          <button class="copy-btn" id="copy-title-${i}">${RT("copy")}</button>
        </div>`).join("")
      :`<div style="color:#888;font-size:13px">${RT("titles_none")}</div>`;
    /* Bind copy buttons */
    titles.forEach((t,i)=>{
      document.getElementById("copy-title-"+i)?.addEventListener("click",function(){
        navigator.clipboard.writeText(t.text).then(()=>{
          this.textContent=RT("copied");
          setTimeout(()=>this.textContent=RT("copy"),1800);
        });
      });
    });
  } else {
    document.getElementById("titles-ai").innerHTML=`<div style="color:#888;font-size:13px">${RT("titles_unavail")}</div>`;
  }

})();
</script>
</body>
</html>
