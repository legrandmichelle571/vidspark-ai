<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSpark AI — Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0f1117 0%, #161b22 100%);
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .onboarding-container {
      width: 100%;
      max-width: 450px;
      background: rgba(22, 27, 34, 0.6);
      border: 1px solid rgba(88, 166, 255, 0.2);
      border-radius: 12px;
      padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 16px;
      color: #8b949e;
      text-align: center;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .checkbox-group {
      margin-bottom: 24px;
    }

    .checkbox-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      margin-right: 12px;
      margin-top: 4px;
      cursor: pointer;
      accent-color: #00d4ff;
      width: 18px;
      height: 18px;
      min-width: 18px;
    }

    .checkbox-label {
      font-size: 14px;
      color: #c9d1d9;
      line-height: 1.5;
    }

    .checkbox-label a {
      color: #00d4ff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .checkbox-label a:hover {
      color: #58a6ff;
      text-decoration: underline;
    }

    .google-button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(90deg, #00d4ff, #0099cc);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .google-button:hover:not(:disabled) {
      box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
    }

    .google-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .google-button svg {
      width: 18px;
      height: 18px;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      font-size: 12px;
      color: #6e7681;
    }

    .skip-link {
      text-align: center;
      font-size: 13px;
    }

    .skip-link a {
      color: #58a6ff;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .skip-link a:hover {
      color: #79c0ff;
      text-decoration: underline;
    }

    .error-message {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      color: #f85149;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
    }

    .google-button.loading {
      opacity: 0.7;
      cursor: wait;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="onboarding-container">
    <div class="logo">✨</div>
    <h1>Welcome to VidSpark AI</h1>
    <p class="subtitle">Intelligent SEO analysis for YouTube creators</p>

    <div class="error-message" id="errorMessage"></div>

    <div class="checkbox-group">
      <label class="checkbox-item">
        <input type="checkbox" id="tosCheck" />
        <span class="checkbox-label">I accept the <a href="https://vidsparkpro.com/terms" target="_blank">Terms of Service</a></span>
      </label>

      <label class="checkbox-item">
        <input type="checkbox" id="privacyCheck" />
        <span class="checkbox-label">I accept the <a href="https://vidsparkpro.com/privacy" target="_blank">Privacy Policy</a></span>
      </label>
    </div>

    <button class="google-button" id="googleButton" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <div class="skip-link">
      <a href="#" id="skipLink">Skip for now (read-only mode)</a>
    </div>
  </div>

  <script src="onboarding.js"></script>
</body>
</html>
